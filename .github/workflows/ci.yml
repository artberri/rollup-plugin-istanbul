name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and npm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Lint and check formatting
        run: pnpm run check
      - name: Check JSR package
        run: npx jsr@0.14.3 publish --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24, 26]
        rollup-version: [3, 4]
    env:
      # Overrides the Node.js version pinned in .prototools for this job.
      PROTO_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js and pnpm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Show Node.js version
        run: node --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install Rollup ${{ matrix.rollup-version }}
        run: pnpm add -D rollup@^${{ matrix.rollup-version }}
      - name: Test
        run: pnpm test

  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [karma, karma-ts]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js and pnpm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install and build the plugin
        run: pnpm install --frozen-lockfile
      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: pnpm install --frozen-lockfile
      - name: Test example
        working-directory: examples/${{ matrix.example }}
        run: pnpm test
