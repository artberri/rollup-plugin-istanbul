name: Publish

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm exchanges the GitHub OIDC token for a
      # short-lived publish token, so no NPM_TOKEN is needed.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and npm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      # `prepack` runs the checks, the build and the tests. Staged: the version
      # stays unpublished until a maintainer approves it on npmjs.com or with
      # `npm stage approve <stage-id>`.
      - name: Stage on npm
        run: npm stage publish

  jsr:
    # JSR versions can't be deleted, so only publish once the checks, the
    # build, the tests and npm staging have succeeded.
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # JSR authenticates GitHub Actions through OIDC, linked in the package
      # settings on jsr.io.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js, pnpm and npm from .prototools
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Check jsr.json and package.json versions match
        run: |
          node -e "
            const npm = require('./package.json').version
            const jsr = require('./jsr.json').version
            if (npm !== jsr) {
              console.error('Version mismatch: package.json ' + npm + ', jsr.json ' + jsr)
              process.exit(1)
            }
          "
      # JSR resolves the plugin's bare imports from node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Publish to JSR
        run: npx jsr@0.14.3 publish
